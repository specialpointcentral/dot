# ============================================================
# Tmux Configuration
# ============================================================

# --- Prefix ---
# Keep the default Ctrl-b prefix.
set -g prefix C-b
bind C-b send-prefix
unbind -q C-a

# --- General ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on

# --- Vi Mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# --- Pane Splitting ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane Navigation (vim-style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane Resizing ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Window Navigation ---
bind -r C-h previous-window
bind -r C-l next-window

# --- New Window in Current Path ---
bind c new-window -c "#{pane_current_path}"

# --- Reload Config ---
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Status Bar ---
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#1e1e2e,bg=#{?client_prefix,#f38ba8,#89b4fa},bold] #{?client_prefix,PREFIX,#S} #[fg=#{?client_prefix,#f38ba8,#89b4fa},bg=#1e1e2e] "
set -g status-right "#[fg=#a6e3a1]#(~/.tmux/scripts/continuum-save-status.sh) #[fg=#585b70]  %Y-%m-%d  %H:%M "
setw -g window-status-format "#[fg=#585b70] #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W #[fg=#a6e3a1,bg=#1e1e2e]"

# --- Pane Borders ---
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# --- Message Style ---
set -g message-style "bg=#89b4fa,fg=#1e1e2e"

# --- Agent Status ---
set -g @agent-status-display-method "window"
set -g @agent-sidebar-width "48"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'samleeney/tmux-agent-status'

# --- Continuum ---
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @resurrect-hook-post-save-all 'tmux set-option -gq @resurrect-last-save-finished-at "$(date +%s)"'

# Load TPM before final option overrides that plugins may mutate.
run '~/.tmux/plugins/tpm/tpm'

# --- Resurrect ---
set -g @resurrect-processes 'ssh vim nvim less man top htop python python3 node npm pnpm yarn "~codex->codex *" "~claude->claude *"'
set -g @resurrect-capture-pane-contents 'on'
